# Lean proofs of the batch-invariant mode (flashinfer/batch_invariant/lean): `lake build` elaborates the engine
# theorems and the generated conformance cases, then `lake exe axioms` enforces the axiom policy (no `sorry`;
# Lean's standard axioms only, `Lean.ofReduceBool` admitted for the decided tables alone). The generated cases
# (Cases.lean) are byte-compared against the Python spec by the quick test tier on every CI job, so a stale file is
# caught there; this workflow checks the proofs. Path-filtered to the package; CPU only; the .lake build directory is
# cached on the toolchain + sources hash.

name: Batch-invariant Lean proofs

on:
  pull_request:
    branches: [main]
    paths:
      - 'flashinfer/batch_invariant/**'
      - '.github/workflows/batch-invariant-lean.yml'
  push:
    branches: [main]
    paths:
      - 'flashinfer/batch_invariant/**'
      - '.github/workflows/batch-invariant-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: batch-invariant-lean-${{ github.ref }}
  cancel-in-progress: true

env:
  LEAN_DIR: flashinfer/batch_invariant/lean

jobs:
  lean:
    name: lake build + axioms check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install elan (the toolchain pinned by lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat "$LEAN_DIR/lean-toolchain")"
          "$HOME/.elan/bin/elan" override set --path "$LEAN_DIR" "$(cat "$LEAN_DIR/lean-toolchain")" || true

      - name: Cache the Lean build directory
        uses: actions/cache@v4
        with:
          path: ${{ env.LEAN_DIR }}/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('flashinfer/batch_invariant/lean/lean-toolchain', 'flashinfer/batch_invariant/lean/lakefile.lean', 'flashinfer/batch_invariant/lean/**/*.lean') }}
          restore-keys: |
            lean-${{ runner.os }}-

      - name: lake build
        working-directory: ${{ env.LEAN_DIR }}
        run: lake build

      - name: Build and run the conformance executable
        working-directory: ${{ env.LEAN_DIR }}
        run: |
          lake build conformance
          lake exe conformance | wc -l

      - name: Axioms check (no sorry; standard axioms; Lean.ofReduceBool for the decided tables only)
        working-directory: ${{ env.LEAN_DIR }}
        run: |
          lake build axioms
          lake exe axioms
